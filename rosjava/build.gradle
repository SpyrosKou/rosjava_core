plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api 'org.ros.rosjava_bootstrap:message_generation:0.3.8'
    //Messages
    implementation 'org.ros.rosjava_messages:std_msgs:0.5.13'
    implementation 'org.ros.rosjava_messages:rosgraph_msgs:1.11.3'


    implementation 'com.google.guava:guava:33.0.0-jre'
//    implementation 'io.netty:netty-bom:4.1.107.Final'
    implementation 'io.netty:netty:3.10.6.Final'
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    compileOnly 'org.slf4j:slf4j-api:1.7.30'

    implementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'
    implementation 'org.apache.xmlrpc:xmlrpc-common:3.1.3'
    implementation 'org.apache.xmlrpc:xmlrpc-server:3.1.3'
    implementation 'commons-httpclient:commons-httpclient:3.1'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.apache.ws.commons:ws-commons-util:1.0.1'




    implementation 'dnsjava:dnsjava:3.6.0'

    implementation 'commons-net:commons-net:3.9.0'

//    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.slf4j:slf4j-api:1.7.30'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.25.4'
    testImplementation 'org.apache.logging.log4j:log4j-core:2.25.4'
    testImplementation 'org.ros.rosjava_messages:nav_msgs:1.13.0'
    testImplementation 'org.ros.rosjava_messages:rosjava_test_msgs:0.3.0', {
        exclude group: "org.ros.rosjava_bootstrap", module: "message_generation"
    }
}

jar {
    manifest {
        version = project.version
//    attributes 'symbolicName' : 'org.ros.rosjava'
//    instruction 'Export-Package', '!org.ros.internal.*, org.ros.*'
//    instruction 'Private-Package', 'org.ros.internal.*'
    }
}


task sourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allSource
}


publishing {
    final repositoryDirectory = "ROS_MAVEN_DEPLOYMENT_REPOSITORY"
    final mavenDeploymentRepositoryProvider = providers.gradleProperty(repositoryDirectory)
    final mavenDeploymentRepository  = mavenDeploymentRepositoryProvider.getOrElse(null)
//    println(repositoryDirectory + " = " + mavenDeploymentRepository);
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifact sourcesJar
        }
    }
    if (mavenDeploymentRepository!=null) {
        repositories {
            maven {
                name "GithubRepositoryLocation"
                url 'file:////' + mavenDeploymentRepository
            }
        }
    } else {
        logger.debug(repositoryDirectory + "not found")
    }
}


test {
    useJUnitPlatform()
}